name: Core3 Mod CI

on:
  push:
    branches:
      - ultrareview-extraction
  pull_request:
    branches:
      - ultrareview-extraction

jobs:
  lua-syntax:
    name: Lua syntax (luac -p) on mod overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      # Scope the syntax gate to our mod-overlay drop target ONLY.
      # Vanilla bin/scripts/ contains pre-existing upstream files that fail
      # strict luac checks (e.g. databaseversions/2573version.lua has a
      # legitimate syntax bug in upstream). We don't own those; we check
      # only the mod's own content under bin/scripts/custom_scripts/.
      - name: Syntax-check every .lua under custom_scripts/
        run: |
          set -e
          TARGET="MMOCoreORB/bin/scripts/custom_scripts"
          if [ ! -d "$TARGET" ]; then
            echo "NOTE: $TARGET does not exist yet (empty on branch). Skipping."
            exit 0
          fi
          FAIL=0
          COUNT=0
          while IFS= read -r -d '' f; do
            COUNT=$((COUNT + 1))
            if ! luac5.3 -p "$f"; then
              echo "FAIL: $f"
              FAIL=1
            fi
          done < <(find "$TARGET" -type f -name '*.lua' -print0)
          if [ $FAIL -ne 0 ]; then
            exit 1
          fi
          echo "All $COUNT custom_scripts .lua files passed luac -p."

  # C++ build is deferred until after Patch-A lands (Deliverable 1 close-out).
  # Requires replicating the full Core3 build chain in Actions:
  #   clang-19, BerkeleyDB 5.3, Lua 5.3 dev, jemalloc, Boost, OpenSSL, ninja.
  # The official SWGEmu bootstrap script is WSL2-specific; we'll either:
  #   (a) port its apt install list to a Dockerfile + run here, or
  #   (b) maintain a self-hosted runner on Ryan's machine.
  # See workplans/phase-1/deliverable-00-dev-loop.md §0.4 for the plan.
